name: build

on:
  push:
    branches: [ master, main, nokvm, 'claude/**' ]
    tags: [ 'v*' ]
    paths-ignore: [ 'windows/**', '**.md', 'pics/**' ]
  pull_request:
    paths-ignore: [ 'windows/**', '**.md', 'pics/**' ]
  workflow_dispatch:
    inputs:
      targets:
        description: 'Images to build'
        type: choice
        options: [ all, edge-v, imagebuilder ]
        default: all

permissions:
  contents: write

env:
  # Edge-V kernels built from source: ImageBuilder (releases) + kmod apk
  # repository (branches), written with the secret KERNELS_TOKEN
  KERNELS_REPO: 220242/khadas-kernels

jobs:
  # Khadas Edge-V kernel (HDMI console, root on USB SSD; KVM), full source
  # build, only when openwrt/kernel-key.sh gives a key without a release
  kernel:
    if: github.event_name != 'workflow_dispatch' || inputs.targets != 'imagebuilder'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        variant: [ edge-v, edge-v-kvm ]
    env:
      OW_REL: v25.12.5
      OW_VER: '25.12.5'
      SRC: /mnt/build/openwrt
      KVM: ${{ matrix.variant == 'edge-v-kvm' && '1' || '0' }}
      GH_TOKEN: ${{ secrets.KERNELS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: kernel key
        id: key
        run: |
          key=$(./openwrt/kernel-key.sh ${{ matrix.variant }})
          tag=kernel-$OW_VER-${{ matrix.variant }}-$key
          {
            echo "TAG=$tag"
            echo "APK_BRANCH=apk-${tag#kernel-}"
            echo "APK_REPO_URL=https://raw.githubusercontent.com/$KERNELS_REPO/apk-${tag#kernel-}"
          } >> "$GITHUB_ENV"
          if curl -fsS -o /dev/null ${GH_TOKEN:+-H "Authorization: Bearer $GH_TOKEN"} \
              "https://api.github.com/repos/$KERNELS_REPO/releases/tags/$tag"; then
            echo "kernel $tag: already built"
            echo "build=0" >> "$GITHUB_OUTPUT"
          else
            [ -n "$GH_TOKEN" ] || { echo "::error::kernel $tag is not built yet and there is no KERNELS_TOKEN secret"; exit 1; }
            echo "kernel $tag: build"
            echo "build=1" >> "$GITHUB_OUTPUT"
          fi

      - name: free disk space
        if: steps.key.outputs.build == '1'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          sudo mkdir -p /mnt/build
          sudo chown "$USER:$USER" /mnt/build
          df -h / /mnt

      - name: install build dependencies
        if: steps.key.outputs.build == '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-dev python3-setuptools python3-pyelftools rsync swig unzip \
            zlib1g-dev file wget bzip2 zstd

      - name: cache sources
        if: steps.key.outputs.build == '1'
        uses: actions/cache@v4
        with:
          path: /mnt/build/openwrt/dl
          key: dl-${{ env.OW_REL }}-${{ hashFiles('openwrt/diffconfig', 'openwrt/feed/**/Makefile') }}
          restore-keys: dl-${{ env.OW_REL }}-

      - name: prepare
        if: steps.key.outputs.build == '1'
        run: ./openwrt/build.sh prepare

      - name: download sources
        if: steps.key.outputs.build == '1'
        run: ./openwrt/build.sh download

      - name: build
        if: steps.key.outputs.build == '1'
        run: ./openwrt/build.sh

      - name: publish apk repository
        if: steps.key.outputs.build == '1'
        run: |
          set -e
          remote="https://x-access-token:${GH_TOKEN}@github.com/${KERNELS_REPO}.git"
          if git ls-remote --exit-code "$remote" "refs/heads/$APK_BRANCH" >/dev/null; then
            echo "branch $APK_BRANCH exists"
            exit 0
          fi
          cd out/apk-repo${{ matrix.variant == 'edge-v-kvm' && '-kvm' || '' }}
          cat > README.md <<EOF
          apk repository of the Khadas Edge-V OpenWrt $OW_VER kernel $TAG
          (${GITHUB_REPOSITORY}@${GITHUB_SHA}, run ${GITHUB_RUN_ID}): every
          kernel module and target package of that kernel (targets/), the
          khadas feed (khadas/). Images use it through /etc/khadas-apk-repo.
          EOF
          git init -q -b "$APK_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "apk repository $TAG"
          git push -q "$remote" "HEAD:refs/heads/$APK_BRANCH"
          echo "published $APK_REPO_URL"

      - name: publish ImageBuilder
        if: steps.key.outputs.build == '1'
        run: |
          set -e
          s=${{ matrix.variant == 'edge-v-kvm' && '-kvm' || '' }}
          mkdir rel
          cp "out/imagebuilder$s.tar.zst" rel/imagebuilder.tar.zst
          cp out/*.manifest rel/
          echo "$APK_REPO_URL" > rel/apk-repo-url
          (cd rel && sha256sum -- * > sha256sums)
          gh release create "$TAG" --repo "$KERNELS_REPO" --title "$TAG" \
            --notes "Khadas Edge-V OpenWrt $OW_VER kernel (${{ matrix.variant }}), ImageBuilder + apk repository $APK_REPO_URL, from ${GITHUB_REPOSITORY}@${GITHUB_SHA}" \
            rel/*

  # own architecture independent packages (LuCI apps, scripts) for the x86 images
  feed:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OW_VER: '25.12.5'
    steps:
      - uses: actions/checkout@v4

      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-dev python3-setuptools python3-pyelftools rsync swig unzip \
            zlib1g-dev file wget bzip2 zstd

      - name: cache SDK
        uses: actions/cache@v4
        with:
          path: build/ib/dl
          key: ib-sdk-${{ env.OW_VER }}

      - name: build feed packages
        run: ./openwrt/ib/sdk-feed.sh

      - uses: actions/upload-artifact@v4
        with:
          name: feed-packages
          path: out/feed/*.apk

  # official ImageBuilder images (x86, boards): official kernel + kmods
  ib:
    needs: feed
    if: github.event_name != 'workflow_dispatch' || inputs.targets != 'edge-v'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [ x86-64-pc, x86-64-vm, i386-pc, edge-v-official, nanopi-r5c,
                   nanopi-zero2, orangepi-zero2, rpi-zero, rpi-zero2 ]
    env:
      OW_VER: '25.12.5'
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk gettext libncurses-dev \
            libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev file \
            wget zstd qemu-utils u-boot-tools device-tree-compiler

      - name: cache ImageBuilder
        uses: actions/cache@v4
        with:
          path: build/ib/dl
          key: ib-${{ env.OW_VER }}-${{ matrix.variant }}

      - uses: actions/download-artifact@v4
        with:
          name: feed-packages
          path: out/feed

      - name: build ${{ matrix.variant }}
        run: ./openwrt/ib/imagebuilder.sh ${{ matrix.variant }}

      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ env.OW_VER }}-${{ matrix.variant }}
          path: out/${{ matrix.variant }}/*

  # Edge-V images with the ImageBuilder of the own kernel
  ib-edge-v:
    needs: [ feed, kernel ]
    if: github.event_name != 'workflow_dispatch' || inputs.targets != 'imagebuilder'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [ edge-v, edge-v-kvm ]
    env:
      OW_VER: '25.12.5'
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk gettext libncurses-dev \
            libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev file \
            wget zstd qemu-utils u-boot-tools device-tree-compiler

      - name: cache ImageBuilder
        uses: actions/cache@v4
        with:
          path: build/ib/dl
          key: ib-${{ env.OW_VER }}-${{ matrix.variant }}

      - uses: actions/download-artifact@v4
        with:
          name: feed-packages
          path: out/feed

      - name: build ${{ matrix.variant }}
        run: ./openwrt/ib/imagebuilder.sh ${{ matrix.variant }}

      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ env.OW_VER }}-${{ matrix.variant }}
          path: out/${{ matrix.variant }}/*

  # tag v*: one release with every image, the firmware selector reads it
  release:
    needs: [ ib, ib-edge-v ]
    if: always() && startsWith(github.ref, 'refs/tags/v') && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: openwrt-*
          path: dl

      - name: collect
        run: |
          mkdir -p rel
          for d in dl/*/; do
            v=$(basename "$d")
            for f in "$d"*; do
              case "$f" in
                */sha256sums) cp "$f" "rel/sha256sums-$v" ;;
                *) cp "$f" rel/ ;;
              esac
            done
          done
          (cd rel && sha256sum -- $(ls | grep -v '^sha256sums') > SHA256SUMS)
          ls -l rel

      - uses: softprops/action-gh-release@v2
        with:
          files: rel/*
