name: build

on:
  push:
    branches: [ master, main, 'claude/**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      zerotier_controller:
        description: 'Add ZeroTier network controller (non-commercial license, private use only, not released)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  khadas-edge:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OW_REL: v25.12.5
      SRC: /mnt/build/openwrt
      ZT_CONTROLLER: ${{ inputs.zerotier_controller && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          sudo mkdir -p /mnt/build
          sudo chown "$USER:$USER" /mnt/build
          df -h / /mnt

      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-dev python3-setuptools python3-pyelftools rsync swig unzip \
            zlib1g-dev file wget bzip2 zstd

      - name: cache sources
        uses: actions/cache@v4
        with:
          path: /mnt/build/openwrt/dl
          key: dl-${{ env.OW_REL }}-${{ hashFiles('openwrt/diffconfig', 'openwrt/feed/**/Makefile') }}
          restore-keys: dl-${{ env.OW_REL }}-

      - name: prepare
        run: ./openwrt/build.sh prepare

      - name: download sources
        run: ./openwrt/build.sh download

      - name: build
        run: ./openwrt/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ env.OW_REL }}-khadas-edge${{ env.ZT_CONTROLLER == '1' && '-zt-controller' || '' }}
          path: out/

      - name: release
        if: startsWith(github.ref, 'refs/tags/v') && env.ZT_CONTROLLER != '1'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
