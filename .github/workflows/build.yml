name: build

on:
  push:
    branches: [ master, main, nokvm, 'claude/**' ]
    tags: [ 'v*' ]
    paths-ignore: [ 'windows/**', '**.md', 'pics/**' ]
  pull_request:
    paths-ignore: [ 'windows/**', '**.md', 'pics/**' ]
  workflow_dispatch:
    inputs:
      zerotier_controller:
        description: 'Add ZeroTier network controller (non-commercial license, private use only, not released)'
        type: boolean
        default: false
      publish_kmods:
        description: 'Publish the Edge-V kmod apk repository (new branch apk-<run id>) for this image'
        type: boolean
        default: true
      targets:
        description: 'Images to build'
        type: choice
        options: [ all, edge-v, imagebuilder ]
        default: all

permissions:
  contents: write

jobs:
  # Khadas Edge-V: full source build (device, U-Boot, kernel with HDMI + UAS),
  # with and without KVM virtual machines
  edge-v:
    if: github.event_name != 'workflow_dispatch' || inputs.targets != 'imagebuilder'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        variant: [ edge-v, edge-v-kvm ]
    env:
      OW_REL: v25.12.5
      SRC: /mnt/build/openwrt
      KVM: ${{ matrix.variant == 'edge-v-kvm' && '1' || '0' }}
      ZT_CONTROLLER: ${{ inputs.zerotier_controller && '1' || '0' }}
      # apk repository (all kmods + khadas feed) matching the image kernel:
      # tag builds and manual runs publish it as a new branch, served by
      # raw.githubusercontent.com; other builds leave the kmod feed disabled
      APK_BRANCH: apk-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.variant }}
      APK_REPO_URL: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_kmods)) && format('https://raw.githubusercontent.com/{0}/apk-{1}-{2}-{3}', github.repository, github.run_id, github.run_attempt, matrix.variant) || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          sudo mkdir -p /mnt/build
          sudo chown "$USER:$USER" /mnt/build
          df -h / /mnt

      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-dev python3-setuptools python3-pyelftools rsync swig unzip \
            zlib1g-dev file wget bzip2 zstd

      - name: cache sources
        uses: actions/cache@v4
        with:
          path: /mnt/build/openwrt/dl
          key: dl-${{ env.OW_REL }}-${{ hashFiles('openwrt/diffconfig', 'openwrt/feed/**/Makefile') }}
          restore-keys: dl-${{ env.OW_REL }}-

      - name: prepare
        run: ./openwrt/build.sh prepare

      - name: download sources
        run: ./openwrt/build.sh download

      - name: build
        run: ./openwrt/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ env.OW_REL }}-khadas-${{ matrix.variant }}${{ env.ZT_CONTROLLER == '1' && '-zt-controller' || '' }}
          path: |
            out/*.img.gz
            out/sha256sums
            out/*.manifest

      - name: publish apk repository
        if: env.APK_REPO_URL != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd out/apk-repo${{ matrix.variant == 'edge-v-kvm' && '-kvm' || '' }}
          cat > README.md <<EOF
          apk repository for the Khadas Edge-V OpenWrt image built from
          ${GITHUB_SHA} (run ${GITHUB_RUN_ID}): every kernel module of that
          kernel (targets/) and the khadas feed (khadas/).
          The image uses it through /etc/apk/repositories.d/distfeeds.list.
          EOF
          git init -q -b "$APK_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "apk repository for ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$APK_BRANCH"
          echo "published $APK_REPO_URL"

  # own architecture independent packages (LuCI apps, scripts) for the x86 images
  feed:
    if: github.event_name != 'workflow_dispatch' || inputs.targets != 'edge-v'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OW_VER: '25.12.5'
    steps:
      - uses: actions/checkout@v4

      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-dev python3-setuptools python3-pyelftools rsync swig unzip \
            zlib1g-dev file wget bzip2 zstd

      - name: cache SDK
        uses: actions/cache@v4
        with:
          path: build/ib/dl
          key: ib-sdk-${{ env.OW_VER }}

      - name: build feed packages
        run: ./openwrt/ib/sdk-feed.sh

      - uses: actions/upload-artifact@v4
        with:
          name: feed-packages
          path: out/feed/*.apk

  # official ImageBuilder images (x86, boards): official kernel + kmods
  ib:
    needs: feed
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [ x86-64-pc, x86-64-vm, i386-pc, edge-v-official, nanopi-r5c,
                   nanopi-zero2, orangepi-zero2, rpi-zero, rpi-zero2 ]
    env:
      OW_VER: '25.12.5'
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk gettext libncurses-dev \
            libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev file \
            wget zstd qemu-utils u-boot-tools device-tree-compiler

      - name: cache ImageBuilder
        uses: actions/cache@v4
        with:
          path: build/ib/dl
          key: ib-${{ env.OW_VER }}-${{ matrix.variant }}

      - uses: actions/download-artifact@v4
        with:
          name: feed-packages
          path: out/feed

      - name: build ${{ matrix.variant }}
        run: ./openwrt/ib/imagebuilder.sh ${{ matrix.variant }}

      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ env.OW_VER }}-${{ matrix.variant }}
          path: out/${{ matrix.variant }}/*

  # tag v*: one release with every image, the firmware selector reads it
  release:
    needs: [ edge-v, ib ]
    if: always() && startsWith(github.ref, 'refs/tags/v') && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: openwrt-*
          path: dl

      - name: collect
        run: |
          mkdir -p rel
          for d in dl/*/; do
            v=$(basename "$d")
            for f in "$d"*; do
              case "$f" in
                */sha256sums) cp "$f" "rel/sha256sums-$v" ;;
                *) cp "$f" rel/ ;;
              esac
            done
          done
          (cd rel && sha256sum -- $(ls | grep -v '^sha256sums') > SHA256SUMS)
          ls -l rel

      - uses: softprops/action-gh-release@v2
        with:
          files: rel/*
