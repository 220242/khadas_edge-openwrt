# ImageBuilder device injection (openwrt/ib/imagebuilder.sh edge-v-official):
# the official rockchip/armv8 kernel + this dtb + this U-Boot
DEVICE=khadas_edge-v
SOC=rk3399
LOADADDR=0x03200000
VENDOR=Khadas
MODEL=Edge-V
DTB=dtb/rk3399-khadas-edge-v.dtb
UBOOT=khadas-edge-v-rk3399
# kernel messages on HDMI (console=tty1) and the serial console
BOOTSCRIPT=boot/boot.cmd
# HDMI console + install to / boot from a USB SSD or NVMe: own packages of
# openwrt/ib/sdk-board.sh (Rockchip DRM kmod for the official kernel)
PACKAGES="kmod-brcmfmac khadas-edge-wifi-firmware khadas-wifi-autoconf kmod-hwmon-pwmfan khadas-edge-console khadas-storage luci-app-khadas-storage"
