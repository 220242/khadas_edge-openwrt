#
# OPENWRT build config (Khadas Edge / RockChip RK3399)
#

# supported OpenWrt releases:
#   25.12.x - apk package manager (default)
#   24.10.x - opkg package manager
#   23.05.x - opkg package manager
#
# override: echo REL=24.10.8 > scripts/build.conf.user
#       or: ./scripts/build -rel=24.10.8

[ "$REL" ] || \
    REL=25.12.5

[ "$VER" ] || \
    VER=v$REL

KERNEL_REL=5.14-rc5.1-ow

KERNEL_DL=https://github.com/khadas/khadas-linux-kernel/releases/download
UBOOT_DL=https://github.com/khadas/khadas-uboot/releases/download

UBOOT_REL=0.16.1

OW_DL=https://downloads.openwrt.org/releases

LABEL=OPENWRT
Label=OpenWrt
BOARD=Edge
BOARDS="Edge"
BITS=64
PART1_LABEL=OW_BOOT
PART2_LABEL=
PART2_1_LABEL=rootfs_data
# OpenWrt generic arm64 target (armvirt was renamed to armsr in 23.05)
TARGET=armsr
SUBTARGET=armv8
OWARCH=aarch64_generic
TARGET_KERNEL_ARCH=arm64
P1OFFSET=4096
PART0SIZE=40
PART1SIZE=99
PART2SIZE=100
OVLTYPE=ext4
HOST_ARCH=x86_64
DL_PROG=curl

# firewall implementation
#   fw3 - iptables based (default), works with the Khadas 5.14 kernel
#   fw4 - nftables based (OpenWrt default), needs a kernel with
#         nft_chain_nat nft_reject_inet nft_fib_inet ... modules
[ "$FIREWALL" ] || \
    FIREWALL=fw3

PKGS_EXTRA_VER=0.1

OWTMP=/tmp/openwrt_khadas
OPKG_CONF=/tmp/openwrt.opkg.conf
OPKG_LIST=/tmp/opkg-lists

COMP=zstd

CMP_BLOCK_SIZE=256K
CMP_OPTS_ZSTD="-Xcompression-level 15"

NO_FAILSAFE=1
OVERLAY_INIT=

## USER REWRITE VARS ##

CONF_USER="$(dirname $0)/build.conf.user"
# echo "[i] try user config $CONF_USER">&2
[ -f "$CONF_USER" ] && . $CONF_USER

# package manager: apk for 25.x and newer, opkg for older releases
[ "$PKG_MGR" ] || \
case $REL in
    2[0-4].*) PKG_MGR=opkg ;;
    *)        PKG_MGR=apk ;;
esac

# remove raw images after compressions
NO_RAW_IMG=1
